services:
  mongo:
    image: mongo:7
    container_name: dosw-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: dosw-api
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017/dosw_parcial
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en el archivo .env}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
