name: CI/CD — DOSW Parcial T2

on:
  push:
    branches: [ main, develop ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/dosw-parcial-t2
  APP_URL: https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', cache: maven }
      - name: Compilar
        run: mvn -B compile --no-transfer-progress

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', cache: maven }
      - name: Pruebas unitarias y cobertura
        run: mvn -B verify --no-transfer-progress
      - name: Publicar reporte de JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: reporte-jacoco
          path: target/site/jacoco/

  analysis:
    needs: test
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', cache: maven }
      - name: Esperar a SonarQube
        run: |
          for _ in $(seq 1 60); do
            if curl -s http://localhost:9000/api/system/status | grep -q '"status":"UP"'; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Analisis estatico con SonarQube
        run: |
          TOKEN=$(curl -s -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate?name=ci" | jq -r .token)
          mvn -B verify sonar:sonar --no-transfer-progress \
            -Dsonar.host.url=http://localhost:9000 -Dsonar.token="$TOKEN"
          curl -s -u "$TOKEN:" "http://localhost:9000/api/measures/component?component=DOSW_ParcialT2_JuanAlvarez&metricKeys=coverage,bugs,vulnerabilities,code_smells" | jq .

  docker:
    needs: analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Configurar variables de la App Service
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          app-settings-json: |
            [
              { "name": "MONGODB_URI", "value": "${{ secrets.MONGODB_URI }}", "slotSetting": false },
              { "name": "JWT_SECRET", "value": "${{ secrets.JWT_SECRET }}", "slotSetting": false },
              { "name": "WEBSITES_PORT", "value": "8080", "slotSetting": false }
            ]
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: ${{ env.IMAGE_NAME }}:${{ github.sha }}

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que la API responde en Azure
        run: |
          for i in $(seq 1 30); do
            CODIGO=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/v3/api-docs")
            echo "Intento $i: $CODIGO"
            if [ "$CODIGO" = "200" ]; then exit 0; fi
            sleep 10
          done
          exit 1
